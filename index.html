<style>

.w{max-width:1100px;margin:0 auto;padding:20px 16px}

[16,"Microsoft to acquire Nokia's devices & services business (ฉบับเต็ม)","Microsoft News","แถลงข่าวบริษัท","2013",R,"เงื่อนไขดีล: ~32,000 คนโอนไป Microsoft; ยอดขายส่วนที่โอน €14.9 พันล้าน (~50% ของ Nokia ปี 2012); Lumia 7.4 ล้านเครื่อง และ Mobile Phones 53.7 ล้านเครื่องใน Q2 2013; license สิทธิบัตร 10 ปี; ตั๋วแปลงสภาพ €1.5 พันล้าน","https://news.microsoft.com/source/2013/09/03/microsoft-to-acquire-nokias-devices-services-business-license-nokias-patents-and-mapping-services/"],

const F=[
["2013-09-03","ประกาศดีล","Microsoft ซื้อธุรกิจ Devices & Services ของ Nokia €3.79 พันล้าน + ใช้สิทธิบัตร €1.65 พันล้าน = €5.44 พันล้าน (เงินสด จากเงินสดต่างประเทศ)","#2"],
["2013-09-03","เหตุผลเชิงกลยุทธ์","เร่งส่วนแบ่งตลาดและกำไรในโทรศัพท์ ผ่านนวัตกรรม synergies และแบรนด์รวม; Ballmer คาดว่าเพิ่ม adjusted EPS ตั้งแต่ปีงบ 2015","#2"],
["2014-04-25","ปิดดีล","Nokia แจ้งขายสำเร็จ; ราคารวมคาดสูงกว่า €5.44 พันล้านเล็กน้อยหลังปรับงบดุล; โรงงาน Chennai (อินเดีย) และ Masan (เกาหลี) ไม่ถูกโอน; ผู้บริหาร เช่น Stephen Elop ย้ายไป Microsoft","Nokia"],
["2015-07-08","ปรับโครงสร้าง","ลดตำแหน่งสูงสุด 7,800 ตำแหน่ง ส่วนใหญ่ในธุรกิจโทรศัพท์","#7"],
["2015-07-08","ด้อยค่า","บันทึกด้อยค่าสินทรัพย์และ goodwill ของ Phone Hardware ประมาณ $7.6 พันล้าน (ไม่กระทบกระแสเงินสดจากการดำเนินงาน) + ค่าปรับโครงสร้าง $750–850 ล้าน","#7"],

["2013-09-03","เงื่อนไขการเงิน","Nokia คาดกำไรจากการขาย ~€3.2 พันล้าน; ค่าธรรมเนียมยกเลิก $750 ล้านหากไม่ผ่านหน่วยงานกำกับ; ตั๋วแปลงสภาพ €1.5 พันล้าน (3 งวด งวดละ €500 ล้าน)","#16, #17"],
["2015-07-08","ยืนยันกับ SEC","Form 8-K ของ Microsoft ระบุตัวเลขปรับโครงสร้างและด้อยค่าตรงกับแถลงข่าว","#18"],
["2015-07-08","ทิศทางใหม่","Nadella: จากการโตธุรกิจโทรศัพท์แยกเดี่ยว เป็นการสร้างระบบนิเวศ Windows รวมอุปกรณ์ของตัวเอง","#7"]
];
let view="s",sort={k:null,d:1};

[["fty",3],["fyr",4],["fst",5]].forEach(([id,i])=>uniq(i).forEach(v=>$(id).add(new Option(v,v))));

function render(){
 const q=$("q").value.toLowerCase(),isS=view==="s";

 let rows=(isS?S:F).filter(r=>r.join(" ").toLowerCase().includes(q));
